spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://db:5432/db
    username: admin
    password: 12345

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true
      properties:
        hibernate:
          dialect: org.hibernate.dialect.PostgreSQLDialect

  config:
    import: optional:configserver:http://localhost:8888